<!doctype html>
<!-- A hand of cards and nothing else, for another site's iframe. What it shows comes from its own address:
     embed/?hand=AS+KH+10D&size=medium&design=english&back=classic-blue&lang=ja
     hand is the cards as ids (AS KH 10D) or one-letter codes; card shows one card instead.
     size is small (the cards alone), medium (bigger, tap to turn over) or large (bigger still, the cards named, and a button).
     It tracks nothing and loads nothing from anywhere else, and keeps nothing on the visitor's device. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>Toranpu · a hand of cards</title>
    <style>
      html, body { margin: 0; }
      body { padding: 8px; background: transparent; color: CanvasText; font-family: ui-rounded, "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; justify-items: center; text-align: center; }
      .felt { width: 100%; min-width: 0; box-sizing: border-box; border-radius: 14px; padding: 12px 8px; display: flex; justify-content: center; }
      .felt[data-felt="true"] { background: radial-gradient(circle at 50% 40%, var(--felt, #2f5d4a), var(--felt-deep, #1f4135)); }
      .names { margin: 0; font-size: 14px; line-height: 1.4; min-height: 1.4em; }
      button { min-height: 44px; min-width: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; font-weight: 600; }
      .credit { justify-self: end; font-size: 12px; opacity: .7; color: inherit; min-height: 24px; display: inline-flex; align-items: center; }
      .bad { margin: 0; font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="felt" id="felt" data-felt="true"></div>
    <p class="names" id="names" hidden></p>
    <button type="button" id="turn" hidden></button>
    <a class="credit" href="https://johnmorrisdotca.github.io/toranpu/" target="_blank" rel="noopener">Toranpu</a>
    <script type="module">
      import { STRINGS, namesList } from "../dist/index.js";
      import { faceName, isCardFace } from "../dist/card-faces.js";
      import { readHand } from "../dist/element-define.js";

      const q = new URLSearchParams(location.search.length > 1 ? location.search : location.hash.slice(1));
      const size = ["small", "medium", "large"].includes(q.get("size")) ? q.get("size") : "medium";
      const on = (name) => q.has(name) && !["off", "0", "false", "no"].includes((q.get(name) ?? "").toLowerCase());
      const lang = (q.get("lang") ?? navigator.language).toLowerCase().startsWith("ja") ? "ja" : "en";
      document.documentElement.lang = lang;
      const words = STRINGS[lang];
      // A colour is a colour and nothing else: only what looks like one is handed on.
      const hex = (name) => (/^#?[0-9a-f]{6}$/i.test(q.get(name) ?? "") ? `#${q.get(name).replace("#", "")}` : null);
      const felt = document.getElementById("felt");
      if (hex("felt") !== null) {
        felt.style.setProperty("--felt", hex("felt"));
        felt.style.setProperty("--felt-deep", hex("felt"));
      }
      if (q.get("felt") === "none") felt.dataset.felt = "false";
      if (hex("ink") !== null) document.body.style.color = hex("ink");

      const one = q.get("card");
      const cards = one !== null ? (isCardFace(one.toUpperCase()) ? [one.toUpperCase()] : null) : readHand(q.get("hand") ?? q.get("cards") ?? "AS KH QD JC 10S");
      if (cards === null || cards.length === 0) {
        felt.replaceWith(Object.assign(document.createElement("p"), { className: "bad", textContent: words.embedBad }));
      } else {
        const shown = document.createElement(one !== null ? "toranpu-card" : "toranpu-hand");
        if (one !== null) shown.setAttribute("card", cards[0]);
        else shown.setAttribute("cards", cards.join(" "));
        shown.setAttribute("size", size);
        shown.setAttribute("lang", lang);
        for (const name of ["design", "back", "mark"]) if (q.has(name)) shown.setAttribute(name, q.get(name).slice(0, 40));
        if (hex("back-colour") !== null) shown.setAttribute("back-colour", hex("back-colour"));
        if (on("face-down")) shown.setAttribute("face-down", "");
        if (on("sound")) shown.setAttribute("sound", "");
        if (one !== null && size !== "small") shown.setAttribute("flip", "");
        if (one === null && q.has("closed")) {
          shown.setAttribute("closed", String(Math.min(1, Math.max(0, Number(q.get("closed")) || 0))));
          shown.setAttribute("reveal", "");
        }
        felt.append(shown);
        // The page that frames this one is told how tall it is, so it can make the frame fit: { toranpu: "height", height }.
        if (parent !== window && typeof ResizeObserver === "function") new ResizeObserver(() => parent.postMessage({ toranpu: "height", height: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*")).observe(document.body);
        // Each change is told to the page that frames this one.
        const tell = (event) => parent !== window && parent.postMessage({ toranpu: event.type.replace("toranpu-", ""), ...event.detail }, "*");
        shown.addEventListener("toranpu-flip", tell);
        shown.addEventListener("toranpu-hand", tell);
        if (size === "large") {
          const names = document.getElementById("names");
          names.hidden = false;
          const turn = document.getElementById("turn");
          turn.hidden = false;
          turn.textContent = words.embedTurn;
          const say = () => (names.textContent = shown.hasAttribute("face-down") ? "" : namesList(cards.map((card) => faceName(card, lang)), lang));
          turn.addEventListener("click", () => {
            if (one !== null) shown.flip();
            else if (shown.hasAttribute("face-down")) void shown.show({ oneByOne: true }).then(say);
            else void shown.hide({ oneByOne: true }).then(say);
            if (one !== null) say();
          });
          say();
        }
      }
    </script>
  </body>
</html>
